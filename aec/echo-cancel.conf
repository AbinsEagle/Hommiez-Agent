# Hommie's private echo canceller: run with `pipewire -c echo-cancel.conf`. It only adds two virtual devices
# (hommie-aec-sink to play through, hommie-aec-source to record from); stopping it removes them.
context.properties = { log.level = 1 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name = aec/libspa-aec-webrtc
        audio.rate = 48000
        audio.channels = 1
        monitor.mode = false
        capture.props  = { node.name = "hommie-aec-capture"  node.passive = true }
        source.props   = { node.name = "hommie-aec-source"   node.description = "Hommie mic (echo cancelled)" }
        sink.props     = { node.name = "hommie-aec-sink"     node.description = "Hommie speaker (echo reference)" }
        playback.props = { node.name = "hommie-aec-playback" node.passive = true }
      }
    }
]
